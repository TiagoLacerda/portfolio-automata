name: portfolio_automata
description: "A new Flutter project."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  portfolio_design_system:
    git:
      url: https://github.com/TiagoLacerda/portfolio-design-system.git
      tag_pattern: v{{version}}
    version: ^1.0.0

  overflow_fallback_widget: ^0.0.2
  overlay_options_button: ^0.0.1

  file_picker: ^13.4.1
  flutter_svg: ^2.2.3
  go_router: ^18.1.4
  modular_localization: ^1.0.0
  typed_data: ^1.4.0
  url_launcher: ^6.3.2
  vector_math: ^2.4.2
  web: ^1.1.1

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true